# This is a Databricks asset bundle definition for vstone.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: vstone
  uuid: db00c3a4-5645-4cef-98b1-178ca5e5679b

include:
  - resources/jobs/*.yaml
  - resources/pipelines/*.yaml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-7e231e39-4faf.cloud.databricks.com/
    variables:
      catalog: vstone
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-7e231e39-4faf.cloud.databricks.com/
      # We explicitly deploy to /Workspace/Users/sanskruti.r.sampate@v4c.ai to make sure we only have a single copy.
      root_path: /Workspace/Users/sanskruti.r.sampate@v4c.ai/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: vstone
      schema: prod
    permissions:
      - user_name: sanskruti.r.sampate@v4c.ai
        level: CAN_MANAGE
